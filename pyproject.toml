[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hybrid-bp-nsg-channel-aligned"
version = "13.0.1"
description = "FIR TensorFlow GPU PUSCH-style 5G NR LDPC with AWGN/CDL-C QPSK channels, explicit FER/BER, and parallel AI/Tanner-GRAND rescue"
requires-python = ">=3.10"
# HPC-safe: do not force pip to resolve/install heavy numerical dependencies.
# Use the existing FIR/Compute Canada environment, then run `pip install -e . --no-deps`.
dependencies = []

[project.optional-dependencies]
# Optional convenience extras only. On FIR/Compute Canada, prefer module/venv-managed packages.
sionna1-no-rt = ["sionna-no-rt>=1.2,<1.3"]
legacy-sionna = ["sionna==0.19.2"]
sionna2-no-rt = ["sionna-no-rt>=2.0,<2.1"]

[tool.setuptools.packages.find]
include = ["hybrid_bp_nsg*"]

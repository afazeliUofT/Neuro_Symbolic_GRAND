project:
  name: hybrid_bp_nsg_v11_selftest
  seed: 123
  output_dir: outputs/hybrid_bp_nsg_v11_selftest

code:
  family: peg_ldpc
  k: 32
  n: 64
  dv: 3
  dc: 6
  seed: 123

data:
  train_samples: 64
  val_samples: 32
  shard_size: 32
  sample_failed_only: false
  bp_collect_iterations: 10
  failed_snr_db_grid: [0, 1, 2]
  failed_snr_probs: [0.45, 0.35, 0.20]
  profiles: ["A"]

train:
  epochs: 1
  batch_size: 16
  lr: 0.001
  dropout: 0.05
  bit_pos_weight: 4.0
  reach_pos_weight: 4.0
  grad_clip: 1.0
  resume: true
  require_gpu: false
  mixed_precision: false
  preload_dataset: true
  loss_weights:
    bit: 1.0
    segment: 0.2
    weight: 0.2
    standard_reachable: 0.2
    expanded_reachable: 0.2
    rescueable: 0.2
    rerank: 0.2
    rank: 0.1

model:
  graph_hidden_dim: 32
  graph_layers: 2
  transformer_heads: 2
  transformer_layers: 1
  top_k_tokens: 16
  num_segments: 4
  max_weight_class: 16
  rerank_list_size: 8

bp:
  hybrid_main_algorithm: nms
  hybrid_main_iterations: 10
  strong_iterations: 20
  micro_iterations: 4
  nms_alpha: 0.8
  early_stop: true

rescue:
  mode: ai
  target_basis: channel_with_bp_punctures
  always_rescue_after_bp_fail: true
  try_bp_basis_fallback: true
  gating_threshold: -1.0
  expanded_threshold: 0.2
  hopeless_threshold: -1.0
  rescue_threshold: 0.05
  micro_trigger_threshold: 0.2
  pool_size: 16
  expanded_pool_size: 32
  top_k_bits: 24
  top_k_oscillation: 8
  top_k_unsat: 12
  max_standard_weight: 6
  max_expanded_weight: 14
  standard_budget: 200
  expanded_budget: 600
  direct_budget: 400
  combo_pool_w_le3: 18
  combo_pool_w_gt3: 12
  enable_osd_repair: true
  osd_support_sizes: [24, 32, 48, 64]
  osd_jitter_passes: 1
  enable_greedy_repair: true
  greedy_repair_steps: 16
  greedy_repair_candidates: 4
  enable_micro_bp: true
  micro_candidate_cap: 4
  likely_weight_topk: 6
  rerank_extra_queries: 16
  rerank_use_net: true
  component_bonus: -0.25
  segment_bonus_scale: 0.05
  component_focus_scale: 0.05
  oscillation_focus_scale: 0.03
  rerank_prior_scale: 0.10
  micro_flip_scale: 1.10
  weight_penalties: [0.0, 0.0, 0.08, 0.20, 0.38, 0.60, 0.85, 1.12, 1.45, 1.80, 2.20, 2.65, 3.15, 3.70, 4.30, 4.95, 5.65, 6.40]

eval:
  samples_per_point: 40
  tail_samples_per_point: 100
  target_frame_errors: 10
  max_samples_per_point: 200
  stop_decoders: ["hybrid_bp_nsg", "bp_nms_20", "bp_nms_50"]
  snr_db_grid: [0]
  profiles: ["A"]

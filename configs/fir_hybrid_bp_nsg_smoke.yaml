project:
  name: hybrid_bp_nsg_nr5g_v11_channel_aligned_smoke
  seed: 31415
  output_dir: outputs/hybrid_bp_nsg_v11_channel_aligned_smoke

code:
  family: sionna_nr_ldpc
  k: 256
  n: 512
  align_to_pcm_length: true
  strict_pcm_check: true
  seed: 31415

data:
  train_samples: 800
  val_samples: 200
  shard_size: 250
  sample_failed_only: true
  bp_collect_iterations: 20
  failed_snr_db_grid: [0, 2, 4]
  failed_snr_probs: [0.20, 0.17, 0.14, 0.12, 0.10, 0.08, 0.07, 0.05, 0.03, 0.02, 0.01]
  profiles: ["A"]

train:
  epochs: 3
  batch_size: 32
  lr: 0.0008
  weight_decay: 0.00001
  dropout: 0.08
  bit_pos_weight: 6.0
  reach_pos_weight: 8.0
  grad_clip: 1.0
  resume: true
  require_gpu: false
  mixed_precision: false
  preload_dataset: true
  loss_weights:
    bit: 1.00
    segment: 0.25
    weight: 0.35
    standard_reachable: 0.20
    expanded_reachable: 0.25
    rescueable: 0.20
    rerank: 0.30
    rank: 0.15

model:
  graph_hidden_dim: 128
  graph_layers: 5
  transformer_heads: 4
  transformer_layers: 2
  top_k_tokens: 64
  num_segments: 8
  max_weight_class: 48
  rerank_list_size: 12

bp:
  hybrid_main_algorithm: nms
  hybrid_main_iterations: 20
  strong_iterations: 50
  micro_iterations: 8
  nms_alpha: 0.8
  early_stop: true

rescue:
  mode: ai
  target_basis: channel_with_bp_punctures
  always_rescue_after_bp_fail: true
  try_bp_basis_fallback: true

  # Gating is kept for logging but not allowed to suppress the post-BP rescue by default.
  gating_threshold: -1.0
  expanded_threshold: 0.20
  hopeless_threshold: -1.0
  rescue_threshold: 0.05
  micro_trigger_threshold: 0.20

  pool_size: 64
  expanded_pool_size: 192
  top_k_bits: 128
  top_k_oscillation: 32
  top_k_unsat: 48
  max_standard_weight: 10
  max_expanded_weight: 32
  standard_budget: 1200
  expanded_budget: 3600
  direct_budget: 2200
  combo_pool_w_le3: 28
  combo_pool_w_gt3: 18

  # Tanner-syndrome OSD: solve H[:, support] e = syndrome(base) on low-cost supports.
  enable_osd_repair: true
  osd_support_sizes: [96, 128, 160, 192, 256, 320, 384, 448, 512]
  osd_jitter_passes: 2

  enable_greedy_repair: true
  greedy_repair_steps: 48
  greedy_repair_candidates: 8

  enable_micro_bp: true
  micro_candidate_cap: 8
  likely_weight_topk: 10
  rerank_extra_queries: 64
  rerank_use_net: true

  component_bonus: -0.35
  segment_bonus_scale: 0.08
  component_focus_scale: 0.10
  oscillation_focus_scale: 0.05
  rerank_prior_scale: 0.10
  micro_flip_scale: 1.10
  weight_penalties: [0.0, 0.0, 0.08, 0.20, 0.38, 0.60, 0.85, 1.12, 1.45, 1.80, 2.20, 2.65, 3.15, 3.70, 4.30, 4.95, 5.65, 6.40, 7.20, 8.05, 8.95, 9.90, 10.90, 11.95, 13.05, 14.20, 15.40, 16.65, 17.95, 19.30, 20.70, 22.15, 23.65, 25.20]

eval:
  samples_per_point: 200
  tail_samples_per_point: 1000
  target_frame_errors: 25
  max_samples_per_point: 2000
  stop_decoders: ["hybrid_bp_nsg", "bp_nms_20", "bp_nms_50"]
  snr_db_grid: [0, 2, 4]
  profiles: ["A"]

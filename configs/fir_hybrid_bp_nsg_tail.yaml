project:
  name: hybrid_bp_nsg_nr5g_pusch_v12_tail
  seed: 31415
  output_dir: outputs/hybrid_bp_nsg_v12_pusch_crc_tail

code:
  family: sionna_nr_pusch_ldpc
  num_coded_bits: 512
  target_coderate: 0.5
  num_bits_per_symbol: 2
  num_layers: 1
  use_scrambler: false
  strict_pcm_check: true
  seed: 31415

data:
  train_samples: 36000
  val_samples: 7200
  shard_size: 250
  sample_failed_only: true
  bp_collect_iterations: 20
  failed_snr_db_grid: [4, 5, 6, 7, 8, 9, 10]
  failed_snr_probs: [0.10, 0.08, 0.07, 0.05, 0.03, 0.02, 0.01]
  profiles: ["A", "C", "E"]
  num_workers: 32
  parallel_chunk_size: 250

train:
  epochs: 48
  batch_size: 96
  lr: 0.0008
  weight_decay: 0.00001
  dropout: 0.08
  bit_pos_weight: 6.0
  reach_pos_weight: 8.0
  grad_clip: 1.0
  resume: true
  require_gpu: true
  mixed_precision: bfloat16
  xla: true
  cpu_threads: 32
  preload_dataset: true
  loss_weights:
    bit: 0.90
    segment: 0.20
    weight: 0.20
    standard_reachable: 0.10
    expanded_reachable: 0.12
    rescueable: 0.10
    rerank: 0.75
    rank: 0.08

model:
  graph_hidden_dim: 128
  graph_layers: 5
  transformer_heads: 4
  transformer_layers: 2
  top_k_tokens: 64
  num_segments: 8
  max_weight_class: 64
  rerank_list_size: 12

bp:
  hybrid_main_algorithm: nms
  hybrid_main_iterations: 20
  strong_iterations: 50
  micro_iterations: 8
  nms_alpha: 0.8
  early_stop: true

rescue:
  mode: ai
  target_basis: channel_with_bp_punctures
  always_rescue_after_bp_fail: true
  try_bp_basis_fallback: true
  require_crc_for_accept: true
  fallback_accept_parity_without_crc: false
  gating_threshold: -1.0
  expanded_threshold: 0.20
  hopeless_threshold: -1.0
  rescue_threshold: 0.05
  micro_trigger_threshold: 0.20
  pool_size: 64
  expanded_pool_size: 192
  top_k_bits: 128
  top_k_oscillation: 32
  top_k_unsat: 48
  max_standard_weight: 10
  max_expanded_weight: 32
  standard_budget: 1200
  expanded_budget: 3600
  direct_budget: 2200
  combo_pool_w_le3: 28
  combo_pool_w_gt3: 18
  enable_osd_repair: true
  osd_support_sizes: [96, 128, 160, 192, 256, 320, 384, 448, 512]
  osd_jitter_passes: 2
  enable_greedy_repair: true
  greedy_repair_steps: 48
  greedy_repair_candidates: 8
  enable_micro_bp: true
  micro_candidate_cap: 8
  likely_weight_topk: 10
  rerank_extra_queries: 64
  rerank_use_net: true
  component_bonus: -0.35
  segment_bonus_scale: 0.08
  component_focus_scale: 0.10
  oscillation_focus_scale: 0.05
  rerank_prior_scale: 0.10
  micro_flip_scale: 1.10
  weight_penalties: [0.0, 0.0, 0.08, 0.20, 0.38, 0.60, 0.85, 1.12, 1.45, 1.80, 2.20, 2.65, 3.15, 3.70, 4.30, 4.95, 5.65, 6.40, 7.20, 8.05, 8.95, 9.90, 10.90, 11.95, 13.05, 14.20, 15.40, 16.65, 17.95, 19.30, 20.70, 22.15, 23.65, 25.20]
  candidate_bank_pool_size: 160
  candidate_bank_top_k_bits: 128
  candidate_bank_top_k_unsat: 48
  candidate_bank_top_k_oscillation: 32
  candidate_bank_max_weight: 12
  candidate_bank_budget: 256
  candidate_bank_enable_greedy: true
  candidate_bank_greedy_steps: 24
  candidate_bank_greedy_candidates: 4
  candidate_bank_enable_osd: true
  candidate_bank_osd_support_sizes: [64, 96, 128]
  candidate_bank_osd_jitter_passes: 1
  oracle_candidate_max_weight: 160

eval:
  require_gpu: true
  mixed_precision: false
  xla: true
  cpu_threads: 32
  samples_per_point: 30000
  tail_samples_per_point: 30000
  target_frame_errors: 400
  max_samples_per_point: 80000
  stop_decoders: ["hybrid_bp_nsg", "bp_nms_20", "bp_nms_50"]
  snr_db_grid: [4, 5, 6, 7, 8, 9, 10]
  profiles: ["A", "C", "E"]
